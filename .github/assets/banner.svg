<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <style>
    .bg{fill:#f6f3ec}.ink{fill:#1d1d1b}.mute{fill:#7a756b}.rule{stroke:#1d1d1b}.hair{stroke:#c9c2b4}.acc{fill:#9b2c1f}.accs{stroke:#9b2c1f}.track{fill:#e4ded2}
    .serif{font-family:'Source Han Serif SC','Noto Serif SC','Songti SC',Georgia,'Times New Roman',serif}
    .mono{font-family:'SF Mono',Menlo,Consolas,monospace}
    @media (prefers-color-scheme:dark){.bg{fill:#14140f}.ink{fill:#ece7db}.mute{fill:#8f897c}.rule{stroke:#ece7db}.hair{stroke:#3a372f}.acc{fill:#e0715f}.accs{stroke:#e0715f}.track{fill:#2a2822}}
  </style>
  <rect class="bg" width="1280" height="420"/>
  <line class="rule" x1="96" y1="72" x2="1184" y2="72" stroke-width="1.5"/>
  <line class="rule" x1="96" y1="78" x2="1184" y2="78" stroke-width="0.5"/>
  <text class="mute mono" x="96" y="58" font-size="13" letter-spacing="3">VOL. 1 · DAILY INTELLIGENCE &amp; DECISION</text>
  <text class="mute mono" x="1184" y="58" font-size="13" letter-spacing="3" text-anchor="end">49 SOURCES · ZERO DEPENDENCIES</text>

  <text class="ink serif" x="96" y="200" font-size="104" font-weight="600" letter-spacing="-2">geointel</text>
  <text class="ink serif" x="100" y="254" font-size="28" letter-spacing="6">全球情报 · 决策备忘录 · 预测复盘</text>
  <text class="mute serif" x="100" y="300" font-size="19" font-style="italic">判断要写下来，才能被检验。</text>

  <line class="hair" x1="760" y1="118" x2="760" y2="330" stroke-width="1"/>
  <g class="serif" font-size="15">
    <text class="mute mono" x="800" y="132" font-size="12" letter-spacing="2">SCENARIOS · 90 DAYS</text>
    <text class="ink" x="800" y="172">管制升级</text>
    <rect class="track" x="920" y="163" width="200" height="3"/><rect class="acc" x="920" y="163" width="124" height="3"/>
    <text class="ink mono" x="1184" y="172" font-size="15" text-anchor="end">62%</text>
    <text class="ink" x="800" y="212">维持现状</text>
    <rect class="track" x="920" y="203" width="200" height="3"/><rect class="acc" x="920" y="203" width="56" height="3"/>
    <text class="ink mono" x="1184" y="212" font-size="15" text-anchor="end">28%</text>
    <text class="ink" x="800" y="252">局部缓和</text>
    <rect class="track" x="920" y="243" width="200" height="3"/><rect class="acc" x="920" y="243" width="20" height="3"/>
    <text class="ink mono" x="1184" y="252" font-size="15" text-anchor="end">10%</text>
    <line class="hair" x1="800" y1="278" x2="1184" y2="278" stroke-width="1"/>
    <text class="mute" x="800" y="306" font-size="14">复盘日到期 → Brier</text>
    <text class="acc mono" x="1184" y="306" font-size="15" text-anchor="end">0.142</text>
  </g>

  <line class="rule" x1="96" y1="362" x2="1184" y2="362" stroke-width="0.5"/>
  <text class="mute mono" x="96" y="388" font-size="12" letter-spacing="2">COLLECT → DIGEST → DECIDE → WATCH → REVIEW</text>
  <text class="mute mono" x="1184" y="388" font-size="12" letter-spacing="2" text-anchor="end">示意数据</text>
</svg>
